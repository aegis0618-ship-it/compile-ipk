name: 编译 OpenWrt Console 插件

on:
  workflow_dispatch:
    inputs:
      target:
        description: 目标平台，例如 x86/64、rockchip/armv8
        required: true
        default: x86/64
        type: string
      firmware_version:
        description: OpenWrt 版本
        required: true
        default: 23.05.5
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: openwrt-console
  PACKAGE_VERSION: 1.5.0-1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 \
            python3-setuptools unzip wget rsync swig time \
            xsltproc zlib1g-dev tree

      - name: 计算 SDK 地址
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          TARGET='${{ inputs.target }}'
          VERSION='${{ inputs.firmware_version }}'
          TARGET_DASH="${TARGET//\//-}"
          BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/"

          INDEX="$(curl -fsSL "$BASE/sha256sums")"
          SDK_FILE="$(printf '%s\n' "$INDEX" |
            sed -nE "s/^[0-9a-f]{64}[[:space:]]+\*?(openwrt-sdk-[^[:space:]]+\.tar\.(xz|zst))$/\1/p" |
            head -n 1)"

          if [ -z "$SDK_FILE" ]; then
            echo "找不到 ${VERSION} ${TARGET} 对应的 SDK"
            exit 1
          fi

          EXPECTED="$(printf '%s\n' "$INDEX" |
            awk -v f="$SDK_FILE" '$2 == "*"f || $2 == f { print $1; exit }')"

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "file=$SDK_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "SDK: $BASE$SDK_FILE"

      - name: 下载并验证 SDK
        run: |
          set -euo pipefail
          mkdir -p work
          wget -q "${{ steps.sdk.outputs.base }}${{ steps.sdk.outputs.file }}" \
            -O work/openwrt-sdk.tar
          echo "${{ steps.sdk.outputs.sha256 }}  work/openwrt-sdk.tar" | sha256sum -c -
          mkdir -p work/openwrt
          tar -xf work/openwrt-sdk.tar -C work/openwrt --strip-components=1

      - name: 安装 feeds
        working-directory: work/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 放置插件源码
        run: |
          set -euo pipefail
          rm -rf work/openwrt/package/openwrt-console
          cp -a package/openwrt-console work/openwrt/package/openwrt-console
          test -f work/openwrt/package/openwrt-console/Makefile
          grep -q '^PKG_NAME:=openwrt-console$' \
            work/openwrt/package/openwrt-console/Makefile

      - name: 配置并编译插件
        working-directory: work/openwrt
        run: |
          echo 'CONFIG_PACKAGE_openwrt-console=m' >> .config
          make defconfig
          make package/openwrt-console/compile V=s

      - name: 严格检查并整理 IPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t PACKAGES < <(
            find work/openwrt/bin -type f \
              -name 'openwrt-console_*.ipk' -print
          )

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "错误：应该只找到 1 个 openwrt-console IPK，实际找到 ${#PACKAGES[@]} 个："
            printf '%s\n' "${PACKAGES[@]}"
            echo "目录中相关包："
            find work/openwrt/bin -type f -name '*.ipk' -print | sort
            exit 1
          fi

          PACKAGE="${PACKAGES[0]}"
          CONTROL="$(mktemp -d)"
          tar -xzf "$PACKAGE" -C "$CONTROL" ./control.tar.gz
          mkdir "$CONTROL/control"
          tar -xzf "$CONTROL/control.tar.gz" -C "$CONTROL/control" ./control

          grep -q '^Package: openwrt-console$' "$CONTROL/control/control"
          grep -q '^Architecture: all$' "$CONTROL/control/control"
          if grep -Eq '^Depends:.*zlib( |=|$)' "$CONTROL/control/control"; then
            echo "错误：openwrt-console 不应依赖 zlib"
            cat "$CONTROL/control/control"
            exit 1
          fi

          tar -tzf "$PACKAGE" | grep -q \
            './data.tar.gz'
          cp "$PACKAGE" artifacts/openwrt-console_${{ env.PACKAGE_VERSION }}_all.ipk
          sha256sum artifacts/*.ipk > artifacts/SHA256SUMS
          cat "$CONTROL/control/control"
          ls -lh artifacts

      - name: 上传 IPK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-console-${{ env.PACKAGE_VERSION }}-${{ inputs.target }}
          path: artifacts/
          if-no-files-found: error
